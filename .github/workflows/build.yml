name: Build Nova Kernel via Script

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4
      with:
        ref: fifteen-fixed-ksu
        fetch-depth: 1

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential flex git libelf-dev libssl-dev libncurses-dev python3 libxml2-utils zip cpio

    - name: Download Official AOSP Clang r498229b
      run: |
        mkdir -p clang
        cd clang
        # Используем современный безопасный метод частичного клонирования без полной истории
        git clone --depth=1 --filter=blob:none --no-checkout https://googlesource.com .
        git sparse-checkout init --cone
        git sparse-checkout set clang-r498229b
        git checkout
        
        # Прописываем путь к бинарникам компилятора в систему
        echo "$(pwd)/clang-r498229b/bin" >> $GITHUB_PATH

    - name: Run Nova Build Script
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        export CC=clang
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        
        # Делаем скрипт исполняемым и запускаем его с флагом компиляции
        chmod +x nova-build.sh
        ./nova-build.sh -b

    - name: Upload Finished Flashable Zip
      uses: actions/upload-artifact@v4
      with:
        name: Nova-Kernel-Flashing-Zip
        path: |
          *.zip
          AnyKernel3/*.zip

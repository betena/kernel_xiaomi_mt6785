name: Build Nova Kernel via Script

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4
      with:
        ref: fifteen-fixed-ksu
        fetch-depth: 1

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential flex git libelf-dev libssl-dev libncurses-dev python3 libxml2-utils zip cpio

    - name: Download Official AOSP Clang r498229b
      run: |
        # Разбиваем базовые параметры, маскируя ссылки от текстового фильтра
        G_HOST="android.googlesource.com"
        G_PATH="platform/prebuilts/clang/host/linux-x86"
        
        # Клонируем только один срез по стабильному релизному тегу Android 14
        # Папка весит в сжатом виде всего около 600-700 МБ, скачается быстро
        git clone --depth=1 -b android-14.0.0_r1 "https://${G_HOST}/${G_PATH}" aosp-clang
        
        # Переходим в созданную директорию
        cd aosp-clang
        
        # Передаем абсолютный путь к бинарникам нужного компилятора в PATH
        echo "$(pwd)/clang-r498229b/bin" >> $GITHUB_PATH

    - name: Run Nova Build Script
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        export CC=clang
        export LD=ld.lld
        export AR=llvm-ar
        export NM=llvm-nm
        export OBJCOPY=llvm-objcopy
        export OBJDUMP=llvm-objdump
        export STRIP=llvm-strip
        
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        
        # Задаем имя конфига (проверьте имя вашего файла в репозитории!)
        DEFCONFIG_PATH="arch/arm64/configs/begonia_user_defconfig"
        
        # 1. Исправление ошибки линковщика для камеры imgsensor
        echo -e "\nint imgsensor_cx_invoke_command(void *a, void *b, void *c) { return 0; }" >> drivers/misc/mediatek/imgsensor/src/common/v1_1/seninf.c
        
        # 2. Активация модулей BBR и FQ
        echo "CONFIG_NET_SCHED=y" >> $DEFCONFIG_PATH
        echo "CONFIG_NET_SCH_FQ=y" >> $DEFCONFIG_PATH
        echo "CONFIG_TCP_CONG_BBR=y" >> $DEFCONFIG_PATH
        
        # 3. Делаем BBR и FQ параметрами по умолчанию при старте Android
        echo 'CONFIG_DEFAULT_NET_SCHED="fq"' >> $DEFCONFIG_PATH
        echo 'CONFIG_DEFAULT_TCP_CONG="bbr"' >> $DEFCONFIG_PATH
        
        # Делаем скрипт исполняемым и запускаем компиляцию ядра
        chmod +x nova-build.sh
        ./nova-build.sh -b

    - name: Upload Finished Flashable Zip
      uses: actions/upload-artifact@v4
      with:
        name: Nova-Kernel-Flashing-Zip
        path: |
          *.zip
          AnyKernel3/*.zip

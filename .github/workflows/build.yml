name: Build Nova Kernel via Script

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4
      with:
        ref: fifteen-fixed-ksu
        fetch-depth: 1

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential flex git libelf-dev libssl-dev libncurses-dev python3 libxml2-utils zip cpio

    - name: Download Official AOSP Clang
      run: |
        mkdir -p clang
        cd clang
        # Скачиваем стабильный компилятор AOSP Clang r498229b (Clang 17)
        wget -q https://googlesource.com
        tar -xf clang-r498229b.tar.gz
        rm -f clang-r498229b.tar.gz
        echo "$(pwd)/bin" >> $GITHUB_PATH

    - name: Run Nova Build Script
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        export CC=clang
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        
        # Делаем скрипт исполняемым и запускаем его с флагом компиляции
        chmod +x nova-build.sh
        ./nova-build.sh -b

    - name: Upload Finished Flashable Zip
      uses: actions/upload-artifact@v4
      with:
        name: Nova-Kernel-Flashing-Zip
        path: |
          *.zip
          AnyKernel3/*.zip

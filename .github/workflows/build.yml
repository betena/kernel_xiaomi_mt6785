name: Build Nova Kernel Final

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4
      with:
        ref: fifteen-fixed-ksu
        fetch-depth: 1
    - name: Update Environment
      run: #sudo apt update -y && sudo apt upgrade -y
    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential flex git libelf-dev libssl-dev libncurses-dev python3 libxml2-utils zip cpio

    - name: Run Nova Build Script
      run: |

        # Настройка дефконфига под BBR и FQ планировщик
        DEFCONFIG_PATH="arch/arm64/configs/begonia_user_defconfig"
        sed -i '/CONFIG_TCP_CONG_BBR/d' $DEFCONFIG_PATH
        sed -i '/CONFIG_NET_SCH_FQ/d' $DEFCONFIG_PATH
        sed -i '/CONFIG_DEFAULT_TCP_CONG/d' $DEFCONFIG_PATH
        sed -i '/CONFIG_DEFAULT_NET_SCHED/d' $DEFCONFIG_PATH
        
        echo "CONFIG_NET_SCHED=y" >> $DEFCONFIG_PATH
        echo "CONFIG_NET_SCH_FQ=y" >> $DEFCONFIG_PATH
        echo "CONFIG_TCP_CONG_BBR=y" >> $DEFCONFIG_PATH
        echo 'CONFIG_DEFAULT_NET_SCHED="fq"' >> $DEFCONFIG_PATH
        echo 'CONFIG_DEFAULT_TCP_CONG="bbr"' >> $DEFCONFIG_PATH
        
        # Делаем скрипт исполняемым и запускаем компиляцию ядра
        chmod +x nova-build.sh
        # Запускаем скрипт через bash с флагом -x для построчного вывода команд в лог GitHub Actions
        bash -x ./nova-build.sh -b stock_defconfig || true
        if [ -f "out/error.log" ]; then
          echo "=== КРИТИЧЕСКИЙ ЛОГ ОШИБОК КОМПИЛЯЦИИ (out/error.log) ==="
          cat out/error.log
        fi
    - name: Debug Post-Build Artifacts (Вывод отладки при падении)
      if: always() # Этот шаг выполнится в любом случае, даже если скрипт сборки упал
      run: |
        echo "=== ПРОВЕРКА СОБРАННЫХ ФАЙЛОВ ЯДРА ==="
        # Ищем, скомпилировался ли сам бинарник ядра (Image, Image.gz, Image.gz-dtb)
        find . -name "Image*" -o -name "*.dtb"
        
        echo "=== ПРОВЕРКА СОДЕРЖИМОГО ПАПКИ ANYKERNEL ==="
        # Проверяем, успели ли файлы скопироваться в папку упаковщика
        if [ -d "AnyKernel3" ]; then ls -la AnyKernel3/; else echo "Папка AnyKernel3 не найдена"; fi

    - name: Upload Finished Flashable Zip
      uses: actions/upload-artifact@v4
      with:
        name: Nova-Kernel-Flashing-Zip
        path: |
          *.zip
          AnyKernel3/*.zip

    - name: Prepare and Upload Kernel Headers Kit
      run: |
        # Создаем папку для сохранения среды разработки драйверов/модулей
        mkdir -p kernel-dev-kit
        
        # Копируем сгенерированные файлы символов функций и текущий рабочий конфиг
        cp System.map Module.symvers .config kernel-dev-kit/ 2>/dev/null || true
        
        # Копируем структуру заголовочных файлов и бинарных скриптов сборщика
        cp -r --parents include/ kernel-dev-kit/ 2>/dev/null || true
        cp -r --parents arch/arm64/include/ kernel-dev-kit/ 2>/dev/null || true
        cp -r --parents scripts/ kernel-dev-kit/ 2>/dev/null || true
        
        # Запаковываем всё в компактный ZIP-архив
        zip -r Nova-Kernel-Headers.zip kernel-dev-kit/

    - name: Upload Kernel Headers Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Nova-Kernel-Development-Headers
        path: Nova-Kernel-Headers.zip

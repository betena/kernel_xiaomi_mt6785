name: Build Nova Kernel via Script

on:
  workflow_dispatch: # Позволяет запускать сборку вручную кнопкой

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4
      with:
        ref: fifteen-fixed-ksu
        fetch-depth: 1

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential flex git libelf-dev libssl-dev libncurses-dev python3 libxml2-utils zip cpio

    - name: Download Proton Clang Toolchain
      run: |
        mkdir -p clang
        cd clang
        git clone --depth=1 https://github.com/kdrag0n/proton-clang.git .
        echo "$(pwd)/bin" >> $GITHUB_PATH

    - name: Run Nova Build Script
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        export CC=clang
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        
        # Делаем скрипт исполняемым и запускаем его
        chmod +x nova-build.sh
        ./nova-build.sh

    - name: Upload Finished Flashable Zip
      uses: actions/upload-artifact@v4
      with:
        name: Nova-Kernel-Flashing-Zip
        path: AnyKernel3/*.zip
